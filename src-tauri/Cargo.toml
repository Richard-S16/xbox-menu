[package]
name = "xbox-menu"
version = "0.4.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
http-range = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Input_XboxController"] }
